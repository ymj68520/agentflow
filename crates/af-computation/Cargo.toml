[package]
autotests = false
name = "af-computation"
description = "Pure static computation-leaf resolution and structured control contract algebra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
af-core = { path = "../af-core" }
af-semantic = { path = "../af-semantic" }
af-ir = { path = "../af-ir" }
af-idl = { path = "../af-idl" }
af-contract = { path = "../af-contract" }
af-effect = { path = "../af-effect" }
af-failure = { path = "../af-failure" }
af-flow = { path = "../af-flow" }
af-resource = { path = "../af-resource" }
af-usage = { path = "../af-usage" }
af-recovery = { path = "../af-recovery" }
af-execution = { path = "../af-execution" }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"

[dev-dependencies]

[build-dependencies]
serde_json = "1"

# The original82 identity/report-sensitive cases run from the exact retained
# Edition1 source tree. They are not silently relabelled as Edition2 tests.
[[test]]
name = "advanced_control_conformance"
path = "tests/advanced_control_conformance.rs"
[[test]]
name = "control_conformance"
path = "tests/control_conformance.rs"
[[test]]
name = "leaf_resolution"
path = "tests/leaf_resolution.rs"
[[test]]
name = "root_recovery_conformance"
path = "tests/root_recovery_conformance.rs"
[[test]]
name = "scope_closure_conformance"
path = "tests/scope_closure_conformance.rs"
# The exact254 Analysis@6 registration cases execute in the frozen 2ad4359
# source archive with its own Registry/Expected, never relabelled as @7.
[[test]]
name = "relation_schema_staging"
path = "tests/relation_schema_staging.rs"
[[test]]
name = "native_capture_conformance"
path = "tests/native_capture_conformance.rs"
[[test]]
name = "native_seed_source_conformance"
path = "tests/native_seed_source_conformance.rs"
[[test]]
name = "raw_port_capture_conformance"
path = "tests/raw_port_capture_conformance.rs"
# Frozen Analysis@5 raw registration and C2 diagnostic execute unchanged
# from the exact e623aab source archive, not under the new global Registry.

[lints]
workspace = true
