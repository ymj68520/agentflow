[package]
autotests = false
name = "af-portable"
description = "Registered portable proof inputs and fresh D0-D10 static RootExport revalidation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
af-core = { path = "../af-core" }
af-idl = { path = "../af-idl" }
af-spec = { path = "../af-spec" }
af-semantic = { path = "../af-semantic" }
af-computation = { path = "../af-computation" }
af-contract = { path = "../af-contract" }
af-effect = { path = "../af-effect" }
af-failure = { path = "../af-failure" }
af-execution = { path = "../af-execution" }
af-flow = { path = "../af-flow" }
af-ir = { path = "../af-ir" }
af-recovery = { path = "../af-recovery" }
af-resource = { path = "../af-resource" }
af-usage = { path = "../af-usage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
unicode-normalization = "0.1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

# The201 frozen Edition1 portable cases and their D9/D10 sidecars execute in
# the pinned legacy job. Current-only staging has its own production tests.
[[test]]
name = "static_surface"
path = "tests/static_surface.rs"
[[test]]
name = "successor_staging"
path = "tests/successor_staging.rs"
