[package]
name = "af-contract"
description = "Static typed ComponentContract ABI, canonicalization, proof context and fail-closed compatibility"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
af-core = { path = "../af-core" }
af-idl = { path = "../af-idl" }
af-semantic = { path = "../af-semantic" }
af-effect = { path = "../af-effect" }
af-failure = { path = "../af-failure" }
af-resource = { path = "../af-resource" }
af-flow = { path = "../af-flow" }
af-usage = { path = "../af-usage" }
af-recovery = { path = "../af-recovery" }
af-execution = { path = "../af-execution" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
