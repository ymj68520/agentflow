[workspace]
resolver = "3"
members = ["crates/af-core", "crates/af-idl", "crates/af-spec", "crates/af-semantic", "crates/af-ir", "crates/af-effect", "crates/af-failure"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://example.invalid/agentflow/agentflow"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are counterproductive for this crate's style.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"          # mixed-language prose docs; backtick churn only
too_many_lines = "allow"        # canonical codec match arms are intentionally one large match

[profile.release]
lto = "thin"
